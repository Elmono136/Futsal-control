<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futsal Control</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 padding:16px;
 text-align:center;
 background:#151515;
 border-bottom:2px solid #e5b638;
}

h1{
 margin:0;
 color:#e5b638;
 font-size:30px;
}

.logo{
 font-size:42px;
}

.container{
 padding:12px;
 max-width:650px;
 margin:auto;
}

.card{
 background:#151515;
 border-radius:16px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 4px 15px #000;
}

label{
 display:block;
 color:#aaa;
 font-size:14px;
 margin-bottom:6px;
}

input,select{
 width:100%;
 padding:13px;
 border-radius:9px;
 border:1px solid #444;
 background:#222;
 color:white;
 font-size:16px;
}

button{
 border:0;
 border-radius:10px;
 padding:13px 15px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}

.gold{
 background:#e5b638;
 color:#111;
}

.red{
 background:#a51e2b;
 color:white;
}

.blue{
 background:#1769aa;
 color:white;
}

.green{
 background:#218c4a;
 color:white;
}

.dark{
 background:#292929;
 color:white;
}

button:disabled{
 opacity:.35;
 cursor:not-allowed;
}

.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.row>*{
 flex:1;
}

.score{
 display:flex;
 justify-content:space-around;
 text-align:center;
 align-items:center;
}

.team{
 font-size:18px;
 font-weight:bold;
}

.goals{
 font-size:60px;
 font-weight:900;
 margin:3px 0;
}

.clock{
 text-align:center;
 font-size:64px;
 font-weight:900;
 color:#e5b638;
 margin:5px;
}

.period{
 text-align:center;
 color:#aaa;
 font-size:14px;
 margin-bottom:5px;
}

.center{
 text-align:center;
}

.stat{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:11px 0;
 border-bottom:1px solid #333;
}

.event{
 padding:9px;
 background:#222;
 border-radius:8px;
 margin:5px 0;
 font-size:14px;
}

.player{
 background:#222;
 padding:12px;
 border-radius:10px;
 margin:7px 0;
}

.playerTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.playerStats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-top:10px;
}

.playerStat{
 background:#111;
 border-radius:8px;
 text-align:center;
 padding:8px 2px;
 font-size:12px;
 color:#aaa;
}

.playerStat strong{
 display:block;
 font-size:18px;
 color:white;
}

.badge{
 display:inline-block;
 background:#e5b638;
 color:#111;
 border-radius:50%;
 min-width:36px;
 padding:8px 5px;
 text-align:center;
 font-weight:bold;
 margin-right:6px;
}

.on{
 background:#218c4a;
 padding:8px 10px;
 border-radius:8px;
 font-size:12px;
 font-weight:bold;
}

.off{
 background:#555;
 padding:8px 10px;
 border-radius:8px;
 font-size:12px;
 font-weight:bold;
}

.small{
 font-size:12px;
 color:#aaa;
}

.sectionTitle{
 color:#e5b638;
 margin-top:0;
}

.modeBox{
 background:#222;
 border-radius:10px;
 padding:12px;
 margin-top:10px;
}

.modeStatus{
 text-align:center;
 font-weight:bold;
 margin-top:8px;
 color:#e5b638;
}

.warning{
 color:#ffcc00;
 font-size:13px;
 margin-top:8px;
}
</style>
</head>

<body>

<header>
<div class="logo">⚽</div>
<h1>FUTSAL CONTROL</h1>
<div class="small">Control de partidos de fútbol sala</div>
</header>

<div class="container">

<!-- CONFIGURACIÓN -->
<div class="card">

<h3 class="sectionTitle">⚙️ CONFIGURACIÓN</h3>

<label>Tu equipo</label>
<input id="homeName" value="CIEZA FS">

<br><br>

<label>Rival</label>
<input id="awayName" value="RIVAL">

<br><br>

<label>Duración de cada parte</label>
<input id="periodMinutes" type="number" min="1" max="120" value="20">

<br><br>

<label>Tipo de reloj</label>

<select id="clockMode">
<option value="stopped">🔴 Reloj parado</option>
<option value="running">🟢 Reloj corrido</option>
</select>

<br><br>

<button class="gold" style="width:100%" onclick="startMatch()">
🏟️ EMPEZAR PARTIDO
</button>

</div>


<!-- MARCADOR -->
<div class="card">

<div class="period" id="periodText">1ª PARTE</div>

<div class="clock" id="clock">20:00</div>

<div class="modeStatus" id="modeStatus">
🔴 RELOJ PARADO
</div>

<br>

<div class="score">

<div>

<div class="team" id="homeTitle">CIEZA FS</div>

<div class="goals" id="homeGoals">0</div>

<div class="row">

<button class="gold" onclick="goal(1)">⚽ + GOL</button>
<button class="dark" onclick="removeGoal(1)">−</button>

</div>

</div>


<div style="font-size:25px">—</div>


<div>

<div class="team" id="awayTitle">RIVAL</div>

<div class="goals" id="awayGoals">0</div>

<div class="row">

<button class="red" onclick="goal(0)">⚽ + GOL</button>
<button class="dark" onclick="removeGoal(0)">−</button>

</div>

</div>

</div>

<br>

<div class="row">

<button class="blue" onclick="toggleClock()" id="clockBtn">
▶ INICIAR
</button>

<button class="dark" onclick="resetClock()">
↺ REINICIAR
</button>

</div>

<br>

<button class="gold" style="width:100%" onclick="nextPeriod()">
⏭️ FINALIZAR / SIGUIENTE PARTE
</button>

</div>


<!-- FALTAS -->
<div class="card">

<h3 class="sectionTitle">🚨 FALTAS</h3>

<div class="stat">

<b id="homeTitle2">CIEZA FS</b>

<div>

<button class="dark" onclick="changeFoul(1,-1)">−</button>

<span id="homeFouls" style="font-size:24px;margin:10px">0</span>

<button class="gold" onclick="changeFoul(1,1)">+1</button>

</div>

</div>


<div class="stat">

<b id="awayTitle2">RIVAL</b>

<div>

<button class="dark" onclick="changeFoul(0,-1)">−</button>

<span id="awayFouls" style="font-size:24px;margin:10px">0</span>

<button class="red" onclick="changeFoul(0,1)">+1</button>

</div>

</div>

<div class="warning">
⚠️ Las faltas se pueden corregir con el botón −.
</div>

</div>


<!-- TARJETAS -->
<div class="card">

<h3 class="sectionTitle">🟨🟥 TARJETAS</h3>

<div class="stat">

<b id="cardHomeName">CIEZA FS</b>

<div>

<button class="gold" onclick="card(1,'🟨')">🟨</button>

<button class="red" onclick="card(1,'🟥')">🟥</button>

</div>

</div>


<div class="stat">

<b id="cardAwayName">RIVAL</b>

<div>

<button class="gold" onclick="card(0,'🟨')">🟨</button>

<button class="red" onclick="card(0,'🟥')">🟥</button>

</div>

</div>

</div>


<!-- JUGADORES -->
<div class="card">

<h3 class="sectionTitle">👥 JUGADORES</h3>

<div id="players"></div>

<button class="gold" style="width:100%" onclick="addPlayer()">
+ AÑADIR JUGADOR
</button>

</div>


<!-- INCIDENCIAS -->
<div class="card">

<h3 class="sectionTitle">📋 INCIDENCIAS</h3>

<div id="events">
<div class="small">Todavía no hay incidencias.</div>
</div>

</div>

</div>


<script>

let hg=0;
let ag=0;

let hf=0;
let af=0;

let seconds=1200;

let periodMinutes=20;

let period=1;

let running=false;

let timer=null;

let clockMode="stopped";

let players=[];


/* =========================
   INICIO DEL PARTIDO
========================= */

function startMatch(){

 document.getElementById('homeTitle').textContent=
 document.getElementById('homeName').value||'CIEZA FS';

 document.getElementById('awayTitle').textContent=
 document.getElementById('awayName').value||'RIVAL';

 document.getElementById('homeTitle2').textContent=
 document.getElementById('homeTitle').textContent;

 document.getElementById('awayTitle2').textContent=
 document.getElementById('awayTitle').textContent;

 document.getElementById('cardHomeName').textContent=
 document.getElementById('homeTitle').textContent;

 document.getElementById('cardAwayName').textContent=
 document.getElementById('awayTitle').textContent;


 periodMinutes=
 parseInt(document.getElementById('periodMinutes').value)||20;

 clockMode=
 document.getElementById('clockMode').value;

 seconds=periodMinutes*60;

 period=1;

 hg=0;
 ag=0;

 hf=0;
 af=0;

 running=false;

 clearInterval(timer);

 document.getElementById('homeGoals').textContent=hg;
 document.getElementById('awayGoals').textContent=ag;

 document.getElementById('homeFouls').textContent=hf;
 document.getElementById('awayFouls').textContent=af;

 document.getElementById('periodText').textContent='1ª PARTE';

 document.getElementById('clockBtn').textContent='▶ INICIAR';

 updateMode();

 fmt();

 addEvent('🏟️ Partido iniciado');

}


/* =========================
   RELOJ
========================= */

function fmt(){

 let m=Math.floor(seconds/60);

 let s=seconds%60;

 document.getElementById('clock').textContent=
 String(m).padStart(2,'0')+':'+
 String(s).padStart(2,'0');

}


function updateMode(){

 let box=document.getElementById('modeStatus');

 if(clockMode==='running'){

   box.textContent='🟢 RELOJ CORRIDO';

 }else{

   box.textContent='🔴 RELOJ PARADO';

 }

}


function toggleClock(){

 running=!running;

 document.getElementById('clockBtn').textContent=
 running?'⏸ PAUSAR':'▶ CONTINUAR';


 if(running){

   clearInterval(timer);

   timer=setInterval(()=>{

     if(seconds>0){

       seconds--;

       fmt();

     }else{

       running=false;

       clearInterval(timer);

       document.getElementById('clockBtn').textContent='▶ CONTINUAR';

       addEvent('⏱️ FIN DEL TIEMPO');

     }

   },1000);

 }else{

   clearInterval(timer);

 }

}


/* =========================
   REINICIAR RELOJ
========================= */

function resetClock(){

 running=false;

 clearInterval(timer);

 seconds=periodMinutes*60;

 fmt();

 document.getElementById('clockBtn').textContent='▶ INICIAR';

 addEvent('↺ Reloj reiniciado');

}


/* =========================
   SIGUIENTE PARTE
========================= */

function nextPeriod(){

 if(period===1){

   period=2;

   running=false;

   clearInterval(timer);

   seconds=periodMinutes*60;

   document.getElementById('periodText').textContent='2ª PARTE';

   document.getElementById('clockBtn').textContent='▶ INICIAR';

   fmt();

   addEvent('⏱️ Comienza la 2ª parte');

 }else{

   running=false;

   clearInterval(timer);

   addEvent('🏁 PARTIDO FINALIZADO');

   document.getElementById('clockBtn').textContent='▶ INICIAR';

 }

}


/* =========================
   GOLES
========================= */

function goal(home){

 if(home){

   hg++;

   document.getElementById('homeGoals').textContent=hg;

   addEvent(
   '⚽ GOL '+
   document.getElementById('homeTitle').textContent
   );

 }else{

   ag++;

   document.getElementById('awayGoals').textContent=ag;

   addEvent(
   '⚽ GOL '+
   document.getElementById('awayTitle').textContent
   );

 }

}


/* =========================
   RESTAR GOLES
========================= */

function removeGoal(home){

 if(home && hg>0){

   hg--;

   document.getElementById('homeGoals').textContent=hg;

   addEvent(
   '↩️ Gol anulado/corregido de '+
   document.getElementById('homeTitle').textContent
   );

 }

 if(!home && ag>0){

   ag--;

   document.getElementById('awayGoals').textContent=ag;

   addEvent(
   '↩️ Gol anulado/corregido de '+
   document.getElementById('awayTitle').textContent
   );

 }

}


/* =========================
   FALTAS
========================= */

function changeFoul(home,value){

 if(home){

   hf=Math.max(0,hf+value);

   document.getElementById('homeFouls').textContent=hf;

   addEvent(
   value>0?'🚨 Falta '+document.getElementById('homeTitle').textContent:
   '↩️ Falta corregida '+document.getElementById('homeTitle').textContent
   );

 }else{

   af=Math.max(0,af+value);

   document.getElementById('awayFouls').textContent=af;

   addEvent(
   value>0?'🚨 Falta '+document.getElementById('awayTitle').textContent:
   '↩️ Falta corregida '+document.getElementById('awayTitle').textContent
   );

 }

}


/* =========================
   TARJETAS
========================= */

function card(home,type){

 let team=home?
 document.getElementById('homeTitle').textContent:
 document.getElementById('awayTitle').textContent;

 addEvent(type+' '+team);

}


/* =========================
   INCIDENCIAS
========================= */

function addEvent(text){

 let box=document.getElementById('events');

 if(box.querySelector('.small')){

   box.innerHTML='';

 }

 let d=document.createElement('div');

 d.className='event';

 d.textContent=
 document.getElementById('periodText').textContent+
 ' · '+
 document.getElementById('clock').textContent+
 ' · '+
 text;

 box.prepend(d);

}


/* =========================
   JUGADORES
========================= */

function addPlayer(){

 let name=prompt('Nombre del jugador');

 if(!name)return;

 players.push({

   name:name,

   on:true,

   goals:0,

   yellow:0,

   red:0,

   fouls:0,

   minutes:0,

   lastStart:Date.now()

 });

 renderPlayers();

}


/* =========================
   CAMBIO DE JUGADOR
========================= */

function togglePlayer(index){

 let p=players[index];

 if(p.on){

   p.on=false;

   updatePlayerMinutes(p);

   addEvent('🔄 Sale de pista: '+p.name);

 }else{

   let onCount=players.filter(x=>x.on).length;

   if(onCount>=5){

     alert('⚠️ No puede haber más de 5 jugadores en pista.');

     return;

   }

   p.on=true;

   p.lastStart=Date.now();

   addEvent('🔄 Entra en pista: '+p.name);

 }

 renderPlayers();

}


/* =========================
   MINUTOS
========================= */

function updatePlayerMinutes(p){

 if(p.on && p.lastStart){

   let diff=(Date.now()-p.lastStart)/60000;

   p.minutes+=diff;

   p.lastStart=Date.now();

 }

}


/* =========================
   ELIMINAR JUGADOR
========================= */

function deletePlayer(index){

 if(players[index].on){

   updatePlayerMinutes(players[index]);

 }

 players.splice(index,1);

 renderPlayers();

}


/* =========================
   RENDER JUGADORES
========================= */

function renderPlayers(){

 let box=document.getElementById('players');

 box.innerHTML='';

 players.forEach((p,i)=>{

   if(p.on){

     updatePlayerMinutes(p);

   }

   let div=document.createElement('div');

   div.className='player';

   div.innerHTML=`

   <div class="playerTop">

     <div>

       <span class="badge">${i+1}</span>

       <strong>${escapeHtml(p.name)}</strong>

     </div>

     <span class="${p.on?'on':'off'}">

       ${p.on?'🟢 EN PISTA':'⚪ FUERA'}

     </span>

   </div>

   <div class="playerStats">

     <div class="playerStat">
       <strong>${p.goals}</strong>
       ⚽ GOLES
     </div>

     <div class="playerStat">
       <strong>${p.yellow}</strong>
       🟨
     </div>

     <div class="playerStat">
       <strong>${p.red}</strong>
       🟥
     </div>

     <div class="playerStat">
       <strong>${p.fouls}</strong>
       🚨
     </div>

     <div class="playerStat">
       <strong>${formatMinutes(p.minutes)}</strong>
       ⏱️ MIN
     </div>

   </div>

   <br>

   <div class="row">

     <button
       class="${p.on?'dark':'green'}"
       onclick="togglePlayer(${i})">

       ${p.on?'↩️ SACAR DE PISTA':'▶️ PONER EN PISTA'}

     </button>

     <button
       class="dark"
       onclick="deletePlayer(${i})">

       ✕ ELIMINAR

     </button>

   </div>

   `;

   box.appendChild(div);

 });

}


function formatMinutes(min){

 return Math.floor(min)+':'+
 String(Math.floor((min%1)*60)).padStart(2,'0');

}


function escapeHtml(text){

 return text
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;')
 .replace(/'/g,'&#039;');

}


/* =========================
   INICIO
========================= */

fmt();

renderPlayers();

</script>

</body>
</html>
