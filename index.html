<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Futsal Control</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#080808;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:30px;
}

header{
 padding:15px;
 text-align:center;
 background:#151515;
 border-bottom:2px solid #d9aa32;
}

.logo{
 font-size:40px;
}

h1{
 margin:0;
 color:#e5b638;
 font-size:26px;
}

h2,h3{
 color:#e5b638;
}

.small{
 font-size:12px;
 color:#999;
}

.container{
 padding:10px;
 max-width:700px;
 margin:auto;
}

.card{
 background:#151515;
 border-radius:15px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 2px 8px #000;
}

label{
 display:block;
 color:#aaa;
 font-size:13px;
 margin-bottom:5px;
}

input{
 width:100%;
 padding:12px;
 border-radius:9px;
 border:1px solid #444;
 background:#222;
 color:#fff;
 font-size:16px;
}

button{
 border:0;
 border-radius:10px;
 padding:11px 13px;
 font-weight:bold;
 font-size:14px;
 cursor:pointer;
 touch-action:manipulation;
}

.gold{
 background:#e5b638;
 color:#111;
}

.red{
 background:#a51e2b;
 color:#fff;
}

.blue{
 background:#1769aa;
 color:#fff;
}

.green{
 background:#19733b;
 color:#fff;
}

.dark{
 background:#292929;
 color:#fff;
}

.row{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.row>*{
 flex:1;
}

.score{
 display:flex;
 justify-content:space-around;
 align-items:center;
 text-align:center;
 gap:8px;
}

.team{
 font-size:16px;
 font-weight:bold;
 min-height:20px;
}

.goals{
 font-size:58px;
 font-weight:900;
 line-height:1.1;
 margin:3px;
}

.goalButtons{
 display:flex;
 gap:5px;
}

.goalButtons button{
 flex:1;
}

.clock{
 text-align:center;
 font-size:64px;
 font-weight:900;
 color:#e5b638;
 margin:5px;
}

.stat{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid #333;
}

.stat:last-child{
 border-bottom:0;
}

.counter{
 display:flex;
 align-items:center;
 gap:7px;
}

.counter span{
 min-width:28px;
 text-align:center;
 font-size:25px;
 font-weight:bold;
}

.foulBox{
 padding:12px;
 border-radius:10px;
 background:#222;
 margin-bottom:8px;
}

.foulBox.warning{
 background:#5b4300;
 border:2px solid #e5b638;
}

.foulBox.danger{
 background:#651b22;
 border:2px solid #e53945;
}

.foulNumber{
 font-size:30px;
 font-weight:900;
}

.warningText{
 font-size:12px;
 font-weight:bold;
 color:#ffd75c;
 margin-top:3px;
}

.event{
 padding:9px;
 background:#222;
 border-radius:8px;
 margin:5px 0;
 font-size:14px;
}

.player{
 background:#222;
 padding:11px;
 border-radius:10px;
 margin:7px 0;
}

.playerTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.playerName{
 font-weight:bold;
 font-size:16px;
}

.badge{
 display:inline-block;
 background:#e5b638;
 color:#111;
 border-radius:50%;
 padding:5px 8px;
 font-weight:bold;
 margin-right:6px;
}

.playerStatus{
 font-size:11px;
 font-weight:bold;
 padding:5px 8px;
 border-radius:8px;
}

.on{
 background:#19733b;
}

.off{
 background:#1769aa;
}

.playerStats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:4px;
 margin-top:9px;
 text-align:center;
}

.playerStat{
 background:#181818;
 border-radius:7px;
 padding:6px 2px;
}

.playerStat b{
 display:block;
 font-size:16px;
}

.playerStat span{
 font-size:9px;
 color:#999;
}

.playerButtons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 margin-top:8px;
}

.empty{
 color:#777;
 text-align:center;
 padding:10px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.82);
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:1000;
}

.modal.show{
 display:flex;
}

.modalBox{
 background:#151515;
 border:1px solid #444;
 border-radius:15px;
 padding:18px;
 width:100%;
 max-width:430px;
 max-height:85vh;
 overflow:auto;
}

.selectPlayer{
 width:100%;
 margin:5px 0;
 padding:13px;
 background:#222;
 color:#fff;
 border:1px solid #444;
 border-radius:9px;
 text-align:left;
}

@media(max-width:450px){

 .clock{
  font-size:55px;
 }

 .goals{
  font-size:48px;
 }

 button{
  padding:10px 8px;
  font-size:12px;
 }

 .team{
  font-size:14px;
 }

 .playerStats{
  grid-template-columns:repeat(5,1fr);
 }

}

</style>
</head>


<body>

<header>

<div class="logo">⚽</div>

<h1>FUTSAL CONTROL</h1>

<div class="small">
Control de partidos de fútbol sala
</div>

</header>


<div class="container">


<!-- PARTIDO -->

<div class="card">

<h3>🏟️ PARTIDO</h3>

<label>Tu equipo</label>

<input id="homeName" value="CIEZA FS">

<br><br>

<label>Rival</label>

<input id="awayName" value="RIVAL">

<br><br>

<button
 class="gold"
 style="width:100%"
 onclick="startMatch()">

▶ EMPEZAR PARTIDO

</button>

</div>


<!-- MARCADOR -->

<div class="card">

<div class="clock" id="clock">
20:00
</div>


<div class="score">


<div style="flex:1">

<div class="team" id="homeTitle">
CIEZA FS
</div>

<div class="goals" id="homeGoals">
0
</div>

<div class="goalButtons">

<button
 class="gold"
 onclick="goal(1)">

⚽ GOL

</button>

<button
 class="dark"
 onclick="removeGoal(1)">

−

</button>

</div>

</div>


<div style="font-size:25px">
—
</div>


<div style="flex:1">

<div class="team" id="awayTitle">
RIVAL
</div>

<div class="goals" id="awayGoals">
0
</div>

<div class="goalButtons">

<button
 class="red"
 onclick="goal(0)">

⚽ GOL

</button>

<button
 class="dark"
 onclick="removeGoal(0)">

−

</button>

</div>

</div>


</div>


<br>


<div class="row">

<button
 class="blue"
 id="clockBtn"
 onclick="toggleClock()">

▶ INICIAR

</button>

<button
 class="dark"
 onclick="resetClock()">

↺ REINICIAR

</button>

</div>

</div>


<!-- FALTAS -->

<div class="card">

<h3>🚨 FALTAS ACUMULADAS</h3>


<div id="homeFoulBox" class="foulBox">

<div class="stat">

<b id="homeTitle2">
CIEZA FS
</b>

<div class="counter">

<button
 class="dark"
 onclick="foul(1,-1)">

−

</button>

<span id="homeFouls">
0
</span>

<button
 class="gold"
 onclick="foul(1,1)">

+

</button>

</div>

</div>

<div id="homeWarning" class="warningText"></div>

</div>


<div id="awayFoulBox" class="foulBox">

<div class="stat">

<b id="awayTitle2">
RIVAL
</b>

<div class="counter">

<button
 class="dark"
 onclick="foul(0,-1)">

−

</button>

<span id="awayFouls">
0
</span>

<button
 class="red"
 onclick="foul(0,1)">

+

</button>

</div>

</div>

<div id="awayWarning" class="warningText"></div>

</div>

</div>


<!-- TARJETAS -->

<div class="card">

<h3>🟨🟥 TARJETAS</h3>


<div class="stat">

<b id="cardHomeName">
CIEZA FS
</b>

<div class="row">

<button
 class="gold"
 onclick="choosePlayerForCard(1,'🟨')">

🟨

</button>

<button
 class="red"
 onclick="choosePlayerForCard(1,'🟥')">

🟥

</button>

</div>

</div>


<div class="stat">

<b id="cardAwayName">
RIVAL
</b>

<div class="row">

<button
 class="gold"
 onclick="choosePlayerForCard(0,'🟨')">

🟨

</button>

<button
 class="red"
 onclick="choosePlayerForCard(0,'🟥')">

🟥

</button>

</div>

</div>

</div>


<!-- JUGADORES -->

<div class="card">

<h3>👥 JUGADORES</h3>

<div id="players">

<div class="empty">
No hay jugadores añadidos.
</div>

</div>


<button
 class="gold"
 style="width:100%;margin-top:8px"
 onclick="addPlayer()">

+ AÑADIR JUGADOR

</button>

</div>


<!-- INCIDENCIAS -->

<div class="card">

<h3>📋 INCIDENCIAS</h3>

<div id="events">

<div class="small">
Todavía no hay incidencias.
</div>

</div>

</div>


</div>


<!-- MODAL JUGADORES -->

<div class="modal" id="playerModal">

<div class="modalBox">

<h3 id="modalTitle">
Seleccionar jugador
</h3>

<div id="playerChoices"></div>

<br>

<button
 class="dark"
 style="width:100%"
 onclick="closeModal()">

CANCELAR

</button>

</div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let hg=0;
let ag=0;

let hf=0;
let af=0;

let seconds=1200;

let running=false;

let timer=null;

let players=[];

let pendingAction=null;

let nextPlayerId=1;


/* =========================
   NOMBRES
========================= */

function homeName(){

 return document.getElementById(
  'homeTitle'
 ).textContent;

}


function awayName(){

 return document.getElementById(
  'awayTitle'
 ).textContent;

}


/* =========================
   PARTIDO
========================= */

function startMatch(){

 let home=
 document.getElementById('homeName')
 .value.trim();

 let away=
 document.getElementById('awayName')
 .value.trim();


 if(!home) home='CIEZA FS';

 if(!away) away='RIVAL';


 document.getElementById(
  'homeTitle'
 ).textContent=home;

 document.getElementById(
  'awayTitle'
 ).textContent=away;


 document.getElementById(
  'homeTitle2'
 ).textContent=home;

 document.getElementById(
  'awayTitle2'
 ).textContent=away;


 document.getElementById(
  'cardHomeName'
 ).textContent=home;

 document.getElementById(
  'cardAwayName'
 ).textContent=away;


 addEvent(
  '🏟️ PARTIDO INICIADO'
 );

}


/* =========================
   CRONÓMETRO
========================= */

function fmt(){

 let m=
 Math.floor(seconds/60);

 let s=
 seconds%60;


 document.getElementById(
  'clock'
 ).textContent=
 String(m).padStart(2,'0')+
 ':'+
 String(s).padStart(2,'0');

}


function toggleClock(){

 if(running){

  running=false;

  clearInterval(timer);

  document.getElementById(
   'clockBtn'
  ).textContent='▶ CONTINUAR';

  addEvent(
   '⏸️ Cronómetro pausado'
  );

 }else{

  running=true;

  document.getElementById(
   'clockBtn'
  ).textContent='⏸ PAUSAR';


  timer=setInterval(function(){

   if(seconds>0){

    seconds--;

    fmt();

    updatePlayerMinutes();

   }else{

    running=false;

    clearInterval(timer);

    document.getElementById(
     'clockBtn'
    ).textContent='▶ CONTINUAR';

    addEvent(
     '⏱️ FIN DEL TIEMPO'
    );

   }

  },1000);

 }

}


/* =========================
   REINICIAR CRONO
========================= */

function resetClock(){

 running=false;

 clearInterval(timer);

 seconds=1200;

 fmt();

 document.getElementById(
  'clockBtn'
 ).textContent='▶ INICIAR';

 addEvent(
  '↺ Cronómetro reiniciado'
 );

}


/* =========================
   GOLES
========================= */

function goal(home){

 if(home){

  hg++;

  document.getElementById(
   'homeGoals'
  ).textContent=hg;

  choosePlayerForGoal(1);

 }else{

  ag++;

  document.getElementById(
   'awayGoals'
  ).textContent=ag;

  choosePlayerForGoal(0);

 }

}


/* =========================
   RESTAR GOL
========================= */

function removeGoal(home){

 if(home){

  if(hg<=0)return;

  hg--;

  document.getElementById(
   'homeGoals'
  ).textContent=hg;

  addEvent(
   '↩️ GOL CORREGIDO '+
   homeName()+
   ' — '+hg+'-'+ag
  );

 }else{

  if(ag<=0)return;

  ag--;

  document.getElementById(
   'awayGoals'
  ).textContent=ag;

  addEvent(
   '↩️ GOL CORREGIDO '+
   awayName()+
   ' — '+hg+'-'+ag
  );

 }

}


/* =========================
   FALTAS
========================= */

function foul(home,amount){

 if(home){

  hf=Math.max(
   0,
   hf+amount
  );

  document.getElementById(
   'homeFouls'
  ).textContent=hf;

  updateFoulBox(1);


  if(amount>0){

   choosePlayerForFoul(1);

  }

 }else{

  af=Math.max(
   0,
   af+amount
  );

  document.getElementById(
   'awayFouls'
  ).textContent=af;

  updateFoulBox(0);


  if(amount>0){

   choosePlayerForFoul(0);

  }

 }

}


/* =========================
   AVISO 5 FALTAS
========================= */

function updateFoulBox(home){

 let number=
 home?hf:af;


 let box=
 document.getElementById(
  home?'homeFoulBox':
  'awayFoulBox'
 );


 let warning=
 document.getElementById(
  home?'homeWarning':
  'awayWarning'
 );


 box.classList.remove(
  'warning'
 );

 box.classList.remove(
  'danger'
 );


 warning.textContent='';


 if(number>=6){

  box.classList.add(
   'danger'
  );

  warning.textContent=
   '🟥 '+number+
   ' FALTAS — SITUACIÓN DE DOBLE PENALTI';

 }else if(number===5){

  box.classList.add(
   'warning'
  );

  warning.textContent=
   '⚠️ 5 FALTAS — PRÓXIMA FALTA: DOBLE PENALTI';

 }

}


/* =========================
   JUGADORES
========================= */

function addPlayer(){

 let dorsal=
 prompt(
  'Número/dorsal del jugador'
 );


 if(dorsal===null)return;


 dorsal=dorsal.trim();


 if(!dorsal){

  alert(
   'Introduce un dorsal.'
  );

  return;

 }


 let name=
 prompt(
  'Nombre del jugador'
 );


 if(name===null)return;


 name=name.trim();


 if(!name){

  alert(
   'Introduce un nombre.'
  );

  return;

 }


 players.push({

  id:nextPlayerId++,

  dorsal:dorsal,

  name:name,

  goals:0,

  yellow:0,

  red:0,

  fouls:0,

  seconds:0,

  active:false

 });


 renderPlayers();

}


/* =========================
   RENDER JUGADORES
========================= */

function renderPlayers(){

 let box=
 document.getElementById(
  'players'
 );


 if(players.length===0){

  box.innerHTML=
   '<div class="empty">'+
   'No hay jugadores añadidos.'+
   '</div>';

  return;

 }


 box.innerHTML=
 players.map(function(p){

  let minutes=
   Math.floor(p.seconds/60);

  let secs=
   p.seconds%60;


  return `

  <div class="player">

   <div class="playerTop">

    <div>

     <span class="badge">
      ${escapeHTML(p.dorsal)}
     </span>

     <span class="playerName">
      ${escapeHTML(p.name)}
     </span>

    </div>

    <span class="playerStatus ${
     p.active?'on':'off'
    }">

     ${p.active?
      '🟢 EN PISTA':
      '🔵 BANQUILLO'}

    </span>

   </div>


   <div class="playerStats">

    <div class="playerStat">
     <b>${p.goals}</b>
     <span>⚽ GOLES</span>
    </div>

    <div class="playerStat">
     <b>${p.yellow}</b>
     <span>🟨 AMAR.</span>
    </div>

    <div class="playerStat">
     <b>${p.red}</b>
     <span>🟥 ROJAS</span>
    </div>

    <div class="playerStat">
     <b>${p.fouls}</b>
     <span>🚨 FALTAS</span>
    </div>

    <div class="playerStat">
     <b>${minutes}:${String(secs).padStart(2,'0')}</b>
     <span>⏱️ MIN.</span>
    </div>

   </div>


   <div class="playerButtons">

    <button
     class="${p.active?'dark':'green'}"
     onclick="togglePlayer(${p.id})">

     ${p.active?
      '↩️ SACAR DE PISTA':
      '🟢 PONER EN PISTA'}

    </button>


    <button
     class="dark"
     onclick="removePlayer(${p.id})">

     ✕ ELIMINAR

    </button>

   </div>

  </div>

  `;

 }).join('');

}


/* =========================
   ENTRAR / SALIR
========================= */

function togglePlayer(id){

 let p=
 players.find(
  x=>x.id===id
 );


 if(!p)return;


 p.active=!p.active;


 addEvent(
  p.active?
   '🟢 ENTRA EN PISTA · '+
   playerLabel(p):
   '🔵 SALE DE PISTA · '+
   playerLabel(p)
 );


 renderPlayers();

}


/* =========================
   MINUTOS JUGADOS
========================= */

function updatePlayerMinutes(){

 players.forEach(function(p){

  if(p.active){

   p.seconds++;

  }

 });


 renderPlayers();

}


/* =========================
   ELIMINAR JUGADOR
========================= */

function removePlayer(id){

 let p=
 players.find(
  x=>x.id===id
 );


 if(!p)return;


 if(!confirm(
  '¿Eliminar a '+
  p.name+
  '?'
 ))return;


 players=
 players.filter(
  x=>x.id!==id
 );


 renderPlayers();

}


/* =========================
   ETIQUETA JUGADOR
========================= */

function playerLabel(p){

 return '#'+
 p.dorsal+
 ' '+
 p.name;

}


/* =========================
   SELECCIONAR JUGADOR
========================= */

function openPlayerModal(title,callback){

 pendingAction=callback;


 document.getElementById(
  'modalTitle'
 ).textContent=title;


 let box=
 document.getElementById(
  'playerChoices'
 );


 if(players.length===0){

  box.innerHTML=
   '<div class="empty">'+
   'Primero añade jugadores.'+
   '</div>';

 }else{

  box.innerHTML=
   players.map(function(p){

    return `

    <button
     class="selectPlayer"
     onclick="selectPlayer(${p.id})">

     <span class="badge">
      ${escapeHTML(p.dorsal)}
     </span>

     ${escapeHTML(p.name)}

    </button>

    `;

   }).join('');

 }


 document.getElementById(
  'playerModal'
 ).classList.add('show');

}


function selectPlayer(id){

 if(pendingAction){

  pendingAction(id);

 }

 closeModal();

}


function closeModal(){

 document.getElementById(
  'playerModal'
 ).classList.remove('show');

 pendingAction=null;

}


/* =========================
   GOL DE JUGADOR
========================= */

function choosePlayerForGoal(home){

 openPlayerModal(
  '⚽ ¿Quién ha marcado?',
  function(id){

   let p=
   players.find(
    x=>x.id===id
   );

   if(!p)return;


   p.goals++;


   addEvent(
    '⚽ GOL · '+
    playerLabel(p)+
    ' · '+
    (home?
     homeName():
     awayName())+
    ' — '+
    hg+'-'+ag
   );


   renderPlayers();

  }
 );

}


/* =========================
   FALTA DE JUGADOR
========================= */

function choosePlayerForFoul(home){

 openPlayerModal(
  '🚨 ¿Quién ha cometido la falta?',
  function(id){

   let p=
   players.find(
    x=>x.id===id
   );

   if(!p)return;


   p.fouls++;


   addEvent(
    '🚨 FALTA · '+
    playerLabel(p)+
    ' · '+
    (home?
     homeName():
     awayName())
   );


   renderPlayers();

  }
 );

}


/* =========================
   TARJETA
========================= */

function choosePlayerForCard(home,type){

 openPlayerModal(
  type==='🟨'?
   '🟨 ¿Quién recibe la amarilla?':
   '🟥 ¿Quién recibe la roja?',
  function(id){

   let p=
   players.find(
    x=>x.id===id
   );

   if(!p)return;


   if(type==='🟨'){

    p.yellow++;

   }else{

    p.red++;

    p.active=false;

   }


   addEvent(
    type+
    ' · '+
    playerLabel(p)+
    ' · '+
    (home?
     homeName():
     awayName())
   );


   renderPlayers();

  }
 );

}


/* =========================
   INCIDENCIAS
========================= */

function addEvent(text){

 let box=
 document.getElementById(
  'events'
 );


 if(box.querySelector('.small')){

  box.innerHTML='';

 }


 let d=
 document.createElement(
  'div'
 );


 d.className='event';


 d.textContent=
  document.getElementById(
   'clock'
  ).textContent+
  ' · '+
  text;


 box.prepend(d);

}


/* =========================
   SEGURIDAD
========================= */

function escapeHTML(text){

 return String(text)
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;')
 .replace(/'/g,'&#039;');

}


/* =========================
   INICIO
========================= */

fmt();

renderPlayers();

</script>

</body>
</html>
